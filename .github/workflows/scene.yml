name: Scene checks
on: [push, pull_request]
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/build_scene.py
      - run: git diff --exit-code -- scenes/scene.xml
      - run: uv run python scripts/scene.py --check
